name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install CPU scientific dependencies when implementation exists
        if: ${{ hashFiles('doe_core/asm.py', 'doe_models/adam.py', 'doe_models/unet.py', 'doe_models/train.py', 'doe_experiments/data.py', 'doe_experiments/metrics.py', 'doe_experiments/benchmark.py', 'ui/app.py', 'tests/core/test_*.py', 'tests/models/test_*.py', 'tests/experiments/test_*.py', 'tests/integration/test_*.py') != '' }}
        run: |
          python -m pip install -r requirements-torch-cpu.txt --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-science.txt
      - name: Check Python syntax
        run: python -m compileall -q doe_core doe_models doe_experiments ui tests
      - name: Run all tests
        run: python -m pytest -q --strict-markers

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ hashFiles('submission/stem_v2/SHA256SUMS.txt') != '' }}
        with:
          python-version: '3.12'
      - name: Verify standalone STEM V2 release
        if: ${{ hashFiles('submission/stem_v2/SHA256SUMS.txt') != '' }}
        working-directory: submission/stem_v2
        run: |
          sha256sum -c SHA256SUMS.txt
          python -m pip install -r src/requirements-torch-cpu.txt --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r src/requirements-science.txt pytest==8.4.2
          cd src
          python -m pytest -q tests/integration/test_fresnel_reference.py tests/integration/test_submission_roundtrip.py tests/integration/test_neural_stem_release.py
